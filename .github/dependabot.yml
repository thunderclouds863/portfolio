# Dependabot version updates (PRD 13 runbook step 1): npm and GitHub Actions, weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps; majors arrive one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay on the version @keystatic/core depends on (two copies break
      # Markdoc node identity). Bump together with Keystatic, by hand.
      - dependency-name: "@markdoc/markdoc"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
