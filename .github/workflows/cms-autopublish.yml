# Workstream 7 — Automated Keystatic CMS Publishing Workflow.
#
# CRITICAL GITHUB EVENT RULE:
# PRs created with the default `secrets.GITHUB_TOKEN` do NOT trigger `on: pull_request`
# workflows (`.github/workflows/ci.yml`), which would deadlock required status checks
# (`Lint, test, build, e2e` and `Lighthouse CI`).
#
# Therefore, this workflow mints a short-lived GitHub App installation token via
# `actions/create-github-app-token@v2` scoped strictly to `contents: read` and
# `pull-requests: write` (no PAT, no `can_approve_pull_request_reviews` needed).
#
# Required owner activation steps (GitHub Settings):
#   1. Settings -> General -> Pull Requests -> Allow auto-merge
#   2. GitHub App (dedicated or `thunderclouds863-keystatic`) with `pull_requests: write`
#      and repo secrets `CMS_PUBLISH_APP_ID` + `CMS_PUBLISH_APP_PRIVATE_KEY`
name: CMS Auto-Publish

on:
  push:
    branches:
      - "content/**"

permissions:
  contents: read

concurrency:
  group: cms-autopublish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  cms-publish:
    name: Validate & Publish CMS Content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout content branch with full history for diff
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main branch for scope verification
        run: git fetch origin main:refs/remotes/origin/main

      - name: Verify strict content-only scope (fail closed)
        env:
          HEAD_REF: ${{ github.ref_name }}
          BASE_REF: main
          DIFF_RANGE: origin/main...HEAD
        run: node scripts/check-cms-pr-scope.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run content schema, Markdoc, and asset gate
        run: npm run test -- tests/content/content-gate.test.ts

      - name: Verify GitHub App publishing credentials are configured (fail closed)
        env:
          APP_ID: ${{ secrets.CMS_PUBLISH_APP_ID }}
          HAS_KEY: ${{ secrets.CMS_PUBLISH_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::CMS_PUBLISH_APP_ID and CMS_PUBLISH_APP_PRIVATE_KEY secrets are required so created PRs trigger required CI checks (GITHUB_TOKEN cannot trigger pull_request workflows)."
            exit 1
          fi

      - name: Mint short-lived GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CMS_PUBLISH_APP_ID }}
          private-key: ${{ secrets.CMS_PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Create or reuse open PR targeting main
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Reusing existing open PR #$EXISTING for $BRANCH"
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "content: publish Keystatic update ($BRANCH)" \
              --body "Automated content-only PR from Keystatic branch \`$BRANCH\`. Verified against strict content-only scope rules and content schema gate.")
            PR_NUM=$(gh pr view "$PR_URL" --json number --jq '.number')
            echo "Created PR #$PR_NUM ($PR_URL)"
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable GitHub auto-merge (waits for required CI checks)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --merge
